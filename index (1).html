<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0D9488" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>SplitEasy — Pincér app</title>
<meta name="description" content="Éttermi számla-szétosztó SaaS. Mobil-first pincér felület: rendelés, drag & drop számla-szétosztás, QR-kódos fizetés, PDF nyugta." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Third-party libraries for QR + PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* =====================================================
   DESIGN TOKENS — Light theme, teal accent
   ===================================================== */
:root {
  /* Background layers */
  --bg:       #F8FAFC;
  --bg-alt:   #F1F5F9;
  --surface:  #FFFFFF;
  --surface-2:#FAFAFA;

  /* Text */
  --ink-900:  #0F172A;
  --ink-700:  #334155;
  --ink-500:  #64748B;
  --ink-400:  #94A3B8;
  --ink-300:  #CBD5E1;

  /* Borders */
  --border:   #E2E8F0;
  --border-strong: #CBD5E1;

  /* Brand — Teal */
  --teal-700: #0F766E;
  --teal-600: #0D9488;
  --teal-500: #14B8A6;
  --teal-400: #2DD4BF;
  --teal-300: #5EEAD4;
  --teal-100: #CCFBF1;
  --teal-50:  #F0FDFA;

  /* Status */
  --green-700:#15803D;
  --green-600:#16A34A;
  --green-500:#22C55E;
  --green-100:#DCFCE7;
  --green-50: #F0FDF4;

  --amber-700:#B45309;
  --amber-600:#D97706;
  --amber-500:#F59E0B;
  --amber-100:#FEF3C7;
  --amber-50: #FFFBEB;

  --rose-700: #BE123C;
  --rose-600: #DC2626;
  --rose-500: #EF4444;
  --rose-100: #FEE2E2;
  --rose-50:  #FEF2F2;

  --plum-600: #9333EA;
  --plum-500: #A855F7;
  --plum-100: #F3E8FF;

  /* Radii */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius:    14px;
  --radius-lg: 20px;
  --radius-xl: 28px;

  /* Shadows — soft, no harsh edges */
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.05), 0 1px 1px rgba(15,23,42,0.04);
  --shadow:    0 4px 12px -2px rgba(15,23,42,0.08), 0 2px 4px -1px rgba(15,23,42,0.04);
  --shadow-md: 0 10px 25px -5px rgba(15,23,42,0.1), 0 4px 10px -3px rgba(15,23,42,0.05);
  --shadow-lg: 0 20px 40px -10px rgba(15,23,42,0.15), 0 8px 16px -6px rgba(15,23,42,0.06);

  /* Fonts */
  --font-sans:    "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;

  /* Spacing */
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --topbar-h:    56px;
  --bottombar-h: 76px;
}

/* =====================================================
   RESET
   ===================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
*:before, *:after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-900);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overscroll-behavior: none;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea {
  font: inherit; color: inherit;
  background: none; border: 0;
  cursor: pointer;
}
button:disabled { cursor: not-allowed; }

/* =====================================================
   APP SHELL
   ===================================================== */
.app {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
}

/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--ink-900);
  flex-shrink: 0;
}
.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
  position: relative;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(13,148,136,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
}
.brand-mark::after {
  content: "";
  position: absolute;
  inset: 7px;
  background: var(--surface);
  border-radius: 3px;
  clip-path: polygon(0 0, 55% 0, 55% 100%, 45% 100%, 45% 0, 100% 0, 100% 100%, 0 100%);
}
.brand em { font-style: italic; color: var(--teal-600); }

.topbar-spacer { flex: 1; }

.waiter-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px 6px 6px;
  background: var(--teal-50);
  border: 1px solid var(--teal-100);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--teal-700);
}
.waiter-chip .avatar {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-500), var(--teal-700));
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 11px;
}
@media (max-width: 400px) {
  .waiter-chip span { display: none; }
}

.topbar-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: grid; place-items: center;
  background: var(--bg-alt);
  color: var(--ink-700);
  transition: background 0.15s;
  flex-shrink: 0;
}
.topbar-btn:hover { background: var(--border); }
.topbar-btn:active { transform: scale(0.95); }
.topbar-btn svg { width: 18px; height: 18px; }

/* CONTENT */
.screen-wrap {
  flex: 1;
  padding: 16px 16px calc(var(--bottombar-h) + 24px + var(--safe-bottom));
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}
@media (min-width: 768px) {
  .screen-wrap { max-width: 1100px; padding: 24px 24px calc(var(--bottombar-h) + 32px); }
}

.screen {
  animation: screenIn 0.3s cubic-bezier(.2,.7,.2,1);
}
@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.screen-head {
  margin-bottom: 18px;
}
.screen-head h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 26px;
  letter-spacing: -0.025em;
  line-height: 1.1;
  color: var(--ink-900);
}
.screen-head h1 em {
  font-style: italic;
  color: var(--teal-600);
  font-weight: 500;
}
.screen-head p {
  color: var(--ink-500);
  font-size: 14px;
  margin-top: 4px;
}
@media (min-width: 640px) {
  .screen-head h1 { font-size: 32px; }
  .screen-head p { font-size: 15px; }
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--ink-500);
  padding: 6px 10px 6px 6px;
  border-radius: 8px;
  margin-bottom: 10px;
  margin-left: -6px;
  font-weight: 500;
  transition: all 0.15s;
}
.back-link:hover { background: var(--bg-alt); color: var(--ink-900); }
.back-link svg { width: 16px; height: 16px; }

/* BOTTOM BAR */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
  padding: 12px 16px calc(12px + var(--safe-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--bottombar-h);
}
.bottom-bar.hidden { display: none; }
.bottom-info {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  color: var(--ink-500);
}
.bottom-info strong { color: var(--ink-900); font-weight: 600; }
.bottom-info .price {
  font-family: var(--font-mono);
  color: var(--teal-700);
  font-weight: 600;
  font-size: 15px;
}

/* BUTTONS */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  padding: 14px 22px;
  border-radius: 12px;
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 48px;
}
.btn-primary {
  background: var(--teal-600);
  color: white;
  box-shadow: 0 4px 12px -2px rgba(13,148,136,0.4);
}
.btn-primary:hover:not(:disabled) { background: var(--teal-700); }
.btn-primary:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 2px 6px -2px rgba(13,148,136,0.4); }
.btn-primary:disabled {
  background: var(--ink-300);
  color: white;
  box-shadow: none;
  opacity: 0.7;
}
.btn-ghost {
  background: var(--surface);
  color: var(--ink-900);
  border: 1px solid var(--border-strong);
}
.btn-ghost:hover { background: var(--bg-alt); }
.btn-danger {
  background: var(--rose-50);
  color: var(--rose-700);
  border: 1px solid var(--rose-100);
}
.btn-danger:hover { background: var(--rose-100); }
.btn-sm { padding: 9px 14px; font-size: 13px; min-height: 36px; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

/* ====================================================
   SCREEN: TABLES
   ==================================================== */
.tables-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--ink-500);
}
.tables-legend .dot {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.tables-legend .dot::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
}
.tables-legend .free::before    { background: var(--green-500); }
.tables-legend .occupied::before{ background: var(--amber-500); }

.tables-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 480px) { .tables-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px) { .tables-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }

.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 130px;
  text-align: left;
  position: relative;
  overflow: hidden;
  transition: all 0.18s;
  box-shadow: var(--shadow-sm);
  width: 100%;
}
.table-card:hover {
  border-color: var(--teal-300);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.table-card:active { transform: translateY(0); }

.table-card.free {
  background: linear-gradient(180deg, var(--green-50), var(--surface));
}
.table-card.free .table-num { color: var(--green-700); }
.table-card.occupied {
  background: linear-gradient(180deg, var(--amber-50), var(--surface));
  border-color: #FDE68A;
}
.table-card.occupied .table-num { color: var(--amber-700); }

.table-num {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 36px;
  letter-spacing: -0.035em;
  line-height: 1;
}
.table-num small {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-500);
}
.table-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 10px;
}
.table-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.table-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.table-card.free .table-badge { color: var(--green-700); }
.table-card.free .table-badge::before { background: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
.table-card.occupied .table-badge { color: var(--amber-700); }
.table-card.occupied .table-badge::before { background: var(--amber-500); box-shadow: 0 0 0 3px var(--amber-100); animation: pulse 2s infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.table-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  color: var(--ink-500);
  margin-top: 2px;
}
.table-meta strong {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--ink-900);
  font-size: 13px;
}

.action-hint {
  margin-top: 20px;
  padding: 14px 16px;
  background: var(--teal-50);
  border: 1px solid var(--teal-100);
  border-radius: var(--radius);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--teal-700);
  line-height: 1.5;
}
.action-hint .ico {
  flex-shrink: 0;
  font-size: 18px;
  line-height: 1;
}

/* ====================================================
   SCREEN: ORDER
   ==================================================== */
.order-toolbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.guest-stepper {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-alt);
  padding: 4px;
  border-radius: 10px;
}
.guest-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--surface);
  color: var(--ink-700);
  font-size: 18px;
  font-weight: 600;
  transition: all 0.12s;
}
.guest-btn:hover:not(:disabled) { color: var(--teal-700); }
.guest-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.guest-val {
  min-width: 60px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
}
.guest-val small { color: var(--ink-500); font-weight: 500; margin-left: 2px; }

.cat-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin: 0 -16px 14px;
  padding: 0 16px 4px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-pill {
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--ink-700);
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s;
}
.cat-pill.active {
  background: var(--teal-600);
  color: white;
  border-color: var(--teal-600);
  box-shadow: 0 2px 6px -1px rgba(13,148,136,0.3);
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
@media (min-width: 900px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

.menu-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  transition: all 0.15s;
  box-shadow: var(--shadow-sm);
  width: 100%;
  min-height: 110px;
}
.menu-card:hover {
  border-color: var(--teal-300);
  box-shadow: var(--shadow);
  transform: translateY(-2px);
}
.menu-card:active { transform: translateY(0); }
.menu-card .emoji {
  font-size: 28px;
  line-height: 1;
}
.menu-card .name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.25;
}
.menu-card .price {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--teal-700);
  margin-top: auto;
}
.menu-card .count-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--teal-600);
  color: white;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 4px -1px rgba(13,148,136,0.4);
  animation: badgePop 0.25s cubic-bezier(.2,1.6,.4,1);
}
@keyframes badgePop {
  from { transform: scale(0); }
  to   { transform: scale(1); }
}

/* Cart preview */
.cart-preview {
  position: fixed;
  bottom: calc(var(--bottombar-h) + var(--safe-bottom) + 8px);
  left: 16px;
  right: 16px;
  max-width: 688px;
  margin: 0 auto;
  z-index: 25;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateY(0);
  transition: all 0.25s cubic-bezier(.2,.7,.2,1);
  animation: cartIn 0.3s cubic-bezier(.2,.7,.2,1);
}
@keyframes cartIn {
  from { transform: translateY(20px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.cart-preview.hidden { display: none; }
.cart-count {
  background: var(--teal-600);
  color: white;
  min-width: 32px;
  height: 32px;
  padding: 0 9px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
}
.cart-info { flex: 1; min-width: 0; }
.cart-info .lbl { font-size: 11px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.cart-info .val {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink-900);
}
.cart-expand-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg-alt);
  display: grid;
  place-items: center;
  color: var(--ink-700);
  transition: background 0.15s;
}
.cart-expand-btn:hover { background: var(--border); }
.cart-expand-btn svg { width: 18px; height: 18px; transition: transform 0.2s; }
.cart-expand-btn.open svg { transform: rotate(180deg); }

/* Cart sheet (full list) */
.cart-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 60;
  animation: fadeIn 0.2s;
}
.cart-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  z-index: 61;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  animation: sheetIn 0.28s cubic-bezier(.2,.7,.2,1);
  box-shadow: 0 -10px 30px -10px rgba(15,23,42,0.2);
}
@keyframes sheetIn {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.sheet-handle {
  width: 40px;
  height: 4px;
  background: var(--border-strong);
  border-radius: 2px;
  margin: 0 auto 14px;
}
.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.sheet-head h3 {
  font-size: 17px;
  font-weight: 700;
}
.sheet-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--bg-alt);
  color: var(--ink-700);
}
.sheet-list {
  flex: 1;
  overflow-y: auto;
  margin: 0 -4px;
}
.cart-row {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
  border-bottom: 1px dashed var(--border);
}
.cart-row:last-child { border-bottom: 0; }
.cart-row .em { font-size: 22px; line-height: 1; }
.cart-row .nm { font-size: 14px; font-weight: 600; }
.cart-row .nm .pr { display: block; font-size: 12px; color: var(--ink-500); font-family: var(--font-mono); font-weight: 500; margin-top: 1px; }
.qty-stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-alt);
  padding: 3px;
  border-radius: 9px;
}
.qty-stepper-btn {
  width: 26px; height: 26px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  background: var(--surface);
  color: var(--ink-700);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.12s;
}
.qty-stepper-btn:hover { color: var(--teal-700); }
.qty-val {
  min-width: 22px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.cart-row .subtotal {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  color: var(--teal-700);
  min-width: 75px;
  text-align: right;
}

.sheet-total {
  padding: 14px 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 2px solid var(--ink-900);
  margin-top: 6px;
}
.sheet-total .lbl { font-size: 14px; color: var(--ink-700); font-weight: 600; }
.sheet-total .val {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--ink-900);
}

/* ====================================================
   SCREEN: SPLIT (TAP-TO-ASSIGN + drag bonus)
   ==================================================== */
.split-summary {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 13px;
}
.split-summary .stat { color: var(--ink-500); display: flex; align-items: baseline; gap: 6px; }
.split-summary .stat strong { color: var(--ink-900); font-weight: 700; font-size: 14px; }
.split-summary .stat.warn strong { color: var(--amber-700); }
.split-summary .stat.ok strong { color: var(--green-700); }

/* Selection bar (shows when items are selected) */
.selection-bar {
  position: sticky;
  top: var(--topbar-h);
  z-index: 20;
  background: var(--teal-600);
  color: white;
  padding: 12px 16px;
  margin: -16px -16px 14px;
  border-radius: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  animation: slideDown 0.25s cubic-bezier(.2,.7,.2,1);
  box-shadow: 0 4px 12px -2px rgba(13,148,136,0.3);
}
@keyframes slideDown {
  from { transform: translateY(-8px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.selection-bar .info { display: flex; align-items: center; gap: 8px; }
.selection-bar .info .num {
  background: white;
  color: var(--teal-700);
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
}
.selection-bar .clear-btn {
  font-size: 13px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  background: rgba(255,255,255,0.18);
  color: white;
}
.selection-bar .clear-btn:hover { background: rgba(255,255,255,0.28); }

.bills-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.bin {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  transition: all 0.18s;
  box-shadow: var(--shadow-sm);
}
.bin.target-active {
  border-color: var(--teal-500);
  background: var(--teal-50);
  box-shadow: 0 0 0 3px rgba(20,184,166,0.15), var(--shadow);
  animation: pulseTarget 1.5s infinite;
}
@keyframes pulseTarget {
  0%, 100% { box-shadow: 0 0 0 3px rgba(20,184,166,0.15), var(--shadow); }
  50%      { box-shadow: 0 0 0 6px rgba(20,184,166,0.08), var(--shadow); }
}
.bin.drop-hover {
  border-color: var(--teal-600);
  background: var(--teal-100);
  transform: scale(1.005);
}

.bin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.bin-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
}
.bin-title .marker {
  width: 12px; height: 12px;
  border-radius: 50%;
}
.bin-pool .marker { background: var(--ink-400); }
.bin-bill[data-color="0"] .marker { background: var(--teal-500); }
.bin-bill[data-color="1"] .marker { background: var(--plum-500); }
.bin-bill[data-color="2"] .marker { background: var(--amber-500); }
.bin-bill[data-color="3"] .marker { background: var(--rose-500); }

.bin-bill[data-color="0"] { border-left: 4px solid var(--teal-500); }
.bin-bill[data-color="1"] { border-left: 4px solid var(--plum-500); }
.bin-bill[data-color="2"] { border-left: 4px solid var(--amber-500); }
.bin-bill[data-color="3"] { border-left: 4px solid var(--rose-500); }

.bin-actions { display: flex; align-items: center; gap: 6px; }
.bin-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-500);
  background: var(--bg-alt);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 600;
}
.bin-del {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: grid; place-items: center;
  color: var(--ink-400);
  background: transparent;
  transition: all 0.15s;
}
.bin-del:hover { background: var(--rose-50); color: var(--rose-600); }
.bin-del svg { width: 16px; height: 16px; }

.bin-items {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 60px;
}
.bin-empty {
  padding: 20px 12px;
  border: 1.5px dashed var(--border);
  border-radius: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-400);
  font-style: italic;
  margin: 2px 0;
}

/* Dish (item) - the draggable / tappable card */
.dish {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  background: var(--bg-alt);
  border: 1.5px solid transparent;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: all 0.15s;
  /* Allow vertical scroll; drag only triggered by long-press */
  touch-action: pan-y;
  position: relative;
  animation: dishIn 0.2s ease;
}
.dish.dragging {
  opacity: 0.4;
  touch-action: none;
}
.dish.long-pressing {
  background: var(--teal-100);
  border-color: var(--teal-400);
  transform: scale(1.02);
  box-shadow: 0 0 0 4px rgba(20,184,166,0.12);
  transition: all 0.15s;
}
@keyframes dishIn {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
.dish:hover { background: var(--surface); border-color: var(--border-strong); }
.dish:active { transform: scale(0.98); }
.dish.selected {
  background: var(--teal-50);
  border-color: var(--teal-500);
  box-shadow: 0 0 0 3px rgba(20,184,166,0.15);
}
.dish.selected::after {
  content: "✓";
  position: absolute;
  top: -6px; right: -6px;
  width: 22px; height: 22px;
  background: var(--teal-600);
  color: white;
  border-radius: 50%;
  font-size: 13px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid var(--surface);
  animation: badgePop 0.2s cubic-bezier(.2,1.6,.4,1);
}
.dish .em { font-size: 22px; line-height: 1; }
.dish .nm { font-weight: 600; color: var(--ink-900); line-height: 1.2; }
.dish .pr {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  color: var(--teal-700);
}
.bin-bill[data-color="1"] .dish .pr { color: var(--plum-600); }
.bin-bill[data-color="2"] .dish .pr { color: var(--amber-700); }
.bin-bill[data-color="3"] .dish .pr { color: var(--rose-700); }

/* Drag ghost */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 999;
  opacity: 0.94;
  transform: rotate(-2deg) scale(1.02);
  box-shadow: var(--shadow-lg);
  border-radius: 10px;
  background: var(--surface);
  border: 2px solid var(--teal-500);
  padding: 11px 12px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  font-size: 14px;
}

.bin-footer {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.bin-footer .lbl { font-size: 12px; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.bin-footer .val {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.bin-bill[data-color="0"] .bin-footer .val { color: var(--teal-700); }
.bin-bill[data-color="1"] .bin-footer .val { color: var(--plum-600); }
.bin-bill[data-color="2"] .bin-footer .val { color: var(--amber-700); }
.bin-bill[data-color="3"] .bin-footer .val { color: var(--rose-600); }
.bin-pool .bin-footer .val { color: var(--ink-700); }

.add-bill-btn {
  width: 100%;
  padding: 14px;
  border: 2px dashed var(--border-strong);
  background: transparent;
  border-radius: var(--radius);
  color: var(--ink-500);
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
}
.add-bill-btn:hover:not(:disabled) {
  border-color: var(--teal-500);
  color: var(--teal-700);
  background: var(--teal-50);
}
.add-bill-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Helper tip */
.split-tip {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--amber-50);
  border: 1px solid var(--amber-100);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--amber-700);
  line-height: 1.5;
}
.split-tip strong { font-weight: 700; }

/* ====================================================
   SCREEN: PAYMENT
   ==================================================== */
.pay-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.pay-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.pay-card[data-color="0"]::before { background: var(--teal-500); }
.pay-card[data-color="1"]::before { background: var(--plum-500); }
.pay-card[data-color="2"]::before { background: var(--amber-500); }
.pay-card[data-color="3"]::before { background: var(--rose-500); }
.pay-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
}
.pay-card.paid {
  background: var(--green-50);
  border-color: var(--green-100);
}
.pay-card.paid::before { background: var(--green-500); }

.pay-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
.pay-head h3 {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.pay-head h3 .marker {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.pay-card[data-color="0"] .marker { background: var(--teal-500); }
.pay-card[data-color="1"] .marker { background: var(--plum-500); }
.pay-card[data-color="2"] .marker { background: var(--amber-500); }
.pay-card[data-color="3"] .marker { background: var(--rose-500); }
.pay-card.paid .marker { background: var(--green-500); }

.pay-amount {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 24px;
  letter-spacing: -0.02em;
  color: var(--ink-900);
}
.pay-items-summary {
  font-size: 13px;
  color: var(--ink-500);
  background: var(--bg-alt);
  padding: 10px 12px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 100px;
  overflow-y: auto;
}
.pay-items-summary .row { display: flex; justify-content: space-between; gap: 12px; }
.pay-items-summary .row span:first-child { color: var(--ink-700); }
.pay-items-summary .row span:last-child { font-family: var(--font-mono); }

.pm-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.pm-btn {
  padding: 14px 8px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--ink-700);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  min-height: 78px;
}
.pm-btn:hover:not(:disabled) {
  border-color: var(--teal-300);
  color: var(--teal-700);
  background: var(--teal-50);
}
.pm-btn.selected {
  background: var(--teal-100);
  border-color: var(--teal-600);
  color: var(--teal-700);
  box-shadow: 0 0 0 3px rgba(13,148,136,0.15);
}
.pm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.pm-btn .ico { font-size: 24px; line-height: 1; }

.pay-status {
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.pay-status.pending {
  background: var(--bg-alt);
  color: var(--ink-500);
  border: 1px dashed var(--border-strong);
}
.pay-status.done {
  background: var(--green-100);
  color: var(--green-700);
  border: 1px solid var(--green-500);
}
.pay-status.done .ico { color: var(--green-600); }

/* ====================================================
   MODAL
   ==================================================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 16px;
  padding-bottom: calc(16px + var(--safe-bottom));
  animation: fadeIn 0.2s;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal {
  background: var(--surface);
  border-radius: 20px;
  max-width: 420px;
  width: 100%;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.3s cubic-bezier(.2,.7,.2,1);
}
@keyframes modalIn {
  from { transform: translateY(20px) scale(0.96); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}

.modal-head {
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal-head h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 19px;
  letter-spacing: -0.02em;
}
.modal-head h2 em { color: var(--teal-600); font-style: italic; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--bg-alt);
  color: var(--ink-700);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.modal-close svg { width: 16px; height: 16px; }
.modal-close:hover { background: var(--border); }

.modal-body {
  padding: 18px 20px;
}
.modal-body p {
  font-size: 14px;
  color: var(--ink-700);
  margin-bottom: 12px;
}
.modal-actions {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

/* QR modal */
.qr-modal-body {
  padding: 22px 20px;
  text-align: center;
}
.qr-amount {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 32px;
  letter-spacing: -0.025em;
  color: var(--ink-900);
  margin-bottom: 4px;
}
.qr-bill-label {
  font-size: 13px;
  color: var(--ink-500);
  margin-bottom: 22px;
}
.qr-code-wrap {
  background: var(--surface);
  padding: 18px;
  border-radius: 16px;
  border: 1px solid var(--border);
  display: inline-block;
  margin-bottom: 16px;
  position: relative;
}
.qr-code-wrap canvas, .qr-code-wrap img {
  display: block;
  margin: 0;
}
.qr-helper {
  font-size: 13px;
  color: var(--ink-500);
  margin-bottom: 18px;
  line-height: 1.45;
}
.qr-helper strong { color: var(--ink-900); font-weight: 600; }
.qvik-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  margin-bottom: 14px;
  background: var(--teal-50);
  border: 1px solid var(--teal-100);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  color: var(--teal-700);
  letter-spacing: 0.01em;
}
.qvik-badge svg { color: var(--teal-600); }
.qr-scan-anim {
  position: absolute;
  inset: 18px;
  pointer-events: none;
  border-radius: 6px;
  overflow: hidden;
}
.qr-scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--teal-500), transparent);
  box-shadow: 0 0 12px var(--teal-500);
  animation: scan 2.5s linear infinite;
  border-radius: 2px;
}
@keyframes scan {
  0%   { top: 0%; opacity: 0.8; }
  50%  { top: 100%; opacity: 1; }
  100% { top: 0%; opacity: 0.8; }
}

/* Receipt modal */
.receipt-modal {
  max-width: 380px;
}
.receipt-modal .modal-head h2 { font-size: 17px; }
.receipt {
  background: white;
  margin: 16px;
  padding: 24px 22px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: #1a1a1a;
  line-height: 1.5;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
  position: relative;
}
.receipt-header {
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 1.5px dashed #888;
  margin-bottom: 12px;
}
.receipt-logo {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--teal-700);
  margin-bottom: 4px;
}
.receipt-logo em { font-style: italic; }
.receipt-tagline {
  font-family: var(--font-sans);
  font-size: 10px;
  color: #555;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.receipt-place {
  font-family: var(--font-sans);
  font-size: 11px;
  color: #444;
  line-height: 1.4;
}
.receipt-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1.5px dashed #888;
  font-size: 11px;
}
.receipt-meta .lbl { color: #777; }
.receipt-meta .val { font-weight: 600; text-align: right; }

.receipt-items {
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1.5px dashed #888;
}
.receipt-item {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  margin-bottom: 6px;
}
.receipt-item-name {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.receipt-item-name .nm {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 12px;
  color: #1a1a1a;
}
.receipt-item-name .total {
  font-weight: 600;
  font-size: 12px;
}
.receipt-item-detail {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #777;
  padding-left: 8px;
}

  font-weight: 700;

}

/* ====================================================

   ==================================================== */
.success-hero {
  text-align: center;
  padding: 32px 20px 24px;
}
.success-circle {
  width: 76px; height: 76px;

  animation: successPop 0.5s cubic-bezier(.2,1.5,.4,1);
}
@keyframes successPop {
  from { transform: scale(0); }
  60%  { transform: scale(1.08); }
  to   { transform: scale(1); }
}
.success-circle svg {
  width: 38px;
  height: 38px;
  color: white;
}
.success-hero h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 26px;
  letter-spacing: -0.025em;
  color: var(--ink-900);
}
.success-hero h1 em { color: var(--teal-600); font-style: italic; }
.success-hero p {
  margin-top: 8px;
  color: var(--ink-500);
  font-size: 14px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: 24px 0;
}
@media (min-width: 480px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);

}

  font-weight: 500;
  font-size: 22px;

  line-height: 1;
}
.stat-card .lbl {

  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-top: 6px;
}

.log-card {
  background: var(--surface);

  border-radius: var(--radius);

}
.log-card h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;

  font-weight: 700;
  margin-bottom: 12px;
}
.log-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed var(--border);

}

.log-row .amt {
  font-family: var(--font-mono);
  font-weight: 700;

}
.log-row.show-receipt-row {
  border-bottom: 0;
  padding-top: 4px;
}
.show-receipt-btn {

  font-weight: 600;
  padding: 6px 10px;
  border-radius: 7px;

  transition: background 0.15s;
}
.show-receipt-btn:hover { background: var(--teal-100); }

/* ====================================================
   TOAST
   ==================================================== */
#toast-root {
  position: fixed;
  top: calc(var(--topbar-h) + 12px + var(--safe-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast {
  background: var(--ink-900);
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.25s cubic-bezier(.2,.7,.2,1);
  display: flex;
  align-items: center;
  gap: 9px;
  max-width: 100%;
}
.toast.out { animation: toastOut 0.25s ease forwards; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-10px); }
}
.toast .ico {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  font-size: 14px;
  color: var(--teal-400);
}
.toast.success .ico { color: var(--green-500); }
.toast.error .ico { color: var(--rose-500); }
.toast .body { line-height: 1.4; }
.toast strong { font-weight: 700; }

/* ====================================================
   WELCOME MODAL
   ==================================================== */
.welcome-body { padding: 4px 20px 18px; }
.welcome-body h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.welcome-body h3 em { color: var(--teal-600); font-style: italic; }
.welcome-body > p {
  font-size: 14px;
  color: var(--ink-500);
  margin-bottom: 18px;
  line-height: 1.5;
}
.welcome-steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 18px;
}
.welcome-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  background: var(--teal-50);
  border: 1px solid var(--teal-100);
  border-radius: 12px;
}
.welcome-step .n {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--teal-600);
  color: white;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 13px;
  font-family: var(--font-mono);
}
.welcome-step .txt {
  font-size: 13px;
  color: var(--ink-700);
  line-height: 1.45;
}
.welcome-step .txt strong { color: var(--ink-900); font-weight: 700; }

/* ====================================================

   ====================================================*/
.split-quick-actions {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.split-quick-actions .qa-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-500);
  font-weight: 700;
  padding: 2px 4px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.split-quick-actions .qa-label .badge {
  background: var(--teal-100);
  color: var(--teal-700);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 700;
}
.split-quick-actions .qa-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.qa-btn {
  padding: 12px 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-900);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
  transition: all 0.15s;
  min-height: 68px;
  line-height: 1.25;
}
.qa-btn .ico { font-size: 20px; line-height: 1; }
.qa-btn small {
  font-size: 11px;
  color: var(--ink-500);
  font-weight: 500;
}
.qa-btn:hover:not(:disabled) {
  border-color: var(--teal-500);
  background: var(--teal-50);
  color: var(--teal-700);
}
.qa-btn:hover:not(:disabled) small { color: var(--teal-600); }
.qa-btn:active:not(:disabled) { transform: scale(0.98); }
.qa-btn:disabled { opacity: 0.5; cursor: not-allowed; }
@media (max-width: 380px) {
  .split-quick-actions .qa-buttons { grid-template-columns: 1fr; }
}

/* ====================================================
   CATEGORIZED ITEMS IN PAY SUMMARY
   ====================================================*/
.pay-items-summary {
  max-height: 180px;
}
.pay-items-summary .cat-head {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-500);
  font-weight: 700;
  padding: 6px 0 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pay-items-summary .cat-head:first-child { padding-top: 0; }
.pay-items-summary .cat-head .ico { font-size: 13px; }
.pay-items-summary .cat-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ====================================================
   TIP SELECTOR (PAYMENT)
   ====================================================*/
.tip-selector {
  padding: 12px;
  background: var(--bg-alt);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pay-card.paid .tip-selector { background: rgba(34,197,94,0.08); }
.tip-selector .tip-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-500);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.tip-selector .tip-label .amt {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--teal-700);
  font-weight: 700;
  text-transform: none;
  letter-spacing: 0;
}
.tip-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.tip-btn {
  padding: 9px 4px;
  border-radius: 8px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-700);
  transition: all 0.15s;
}
.tip-btn:hover:not(:disabled) { border-color: var(--teal-300); color: var(--teal-700); }
.tip-btn.selected {
  background: var(--teal-600);
  color: white;
  border-color: var(--teal-600);
  box-shadow: 0 2px 6px -1px rgba(13,148,136,0.3);
}
.tip-btn:disabled { opacity: 0.55; cursor: not-allowed; }

/* Pay total breakdown */
.pay-breakdown {
  padding: 10px 12px;
  background: var(--bg-alt);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 13px;
}
.pay-card.paid .pay-breakdown { background: rgba(34,197,94,0.08); }
.pay-breakdown .row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  color: var(--ink-700);
}
.pay-breakdown .row .mono { font-family: var(--font-mono); font-weight: 600; }
.pay-breakdown .row.tip-row { color: var(--teal-700); }
.pay-breakdown .row.tip-row .mono { color: var(--teal-700); }
.pay-breakdown .row.grand {
  color: var(--ink-900);
  font-weight: 700;
  font-size: 15px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  margin-top: 3px;
}
.pay-breakdown .row.grand .mono { color: var(--ink-900); font-size: 16px; }
.pay-card.paid .pay-breakdown .row.grand { color: var(--green-700); }
.pay-card.paid .pay-breakdown .row.grand .mono { color: var(--green-700); }

/* Receipt - kategória + borravaló */
.receipt-cat-head {
  font-family: var(--font-sans);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #777;
  font-weight: 700;
  padding: 5px 0 3px;
  margin-bottom: 3px;
  border-bottom: 1px dotted #bbb;
  display: flex;
  align-items: center;
  gap: 4px;
}
.receipt-cat-head:first-child { padding-top: 0; }
.receipt-total-row.tip-row { color: #0F766E; font-weight: 600; }
.receipt-total-row.tip-row .mono { color: #0F766E; }

/* ====================================================
   MERGE (ASZTAL-ÖSSZEVONÁS)
   ====================================================*/
.merge-bar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.merge-bar .legend-pair {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-500);
  flex: 1;
  min-width: 0;
}
.merge-bar .legend-pair .dot { display: inline-flex; align-items: center; gap: 5px; }
.merge-bar .legend-pair .dot::before {
  content: ""; width: 9px; height: 9px; border-radius: 50%;
}
.merge-bar .legend-pair .free::before     { background: var(--green-500); }
.merge-bar .legend-pair .occupied::before { background: var(--amber-500); }
.merge-bar .legend-pair .merged::before   { background: var(--teal-500); }

.merge-btn-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1.5px solid var(--border-strong);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-700);
  transition: all 0.15s;
  white-space: nowrap;
}
.merge-btn-trigger:hover {
  border-color: var(--teal-500);
  color: var(--teal-700);
  background: var(--teal-50);
}
.merge-btn-trigger:active { transform: scale(0.97); }
.merge-btn-trigger .ico { font-size: 14px; }

/* Merge mode banner (sticky tetejére) */
.merge-mode-banner {
  background: var(--teal-600);
  color: white;
  padding: 12px 16px;
  margin: -16px -16px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  position: sticky;
  top: var(--topbar-h);
  z-index: 25;
  box-shadow: 0 4px 12px -2px rgba(13,148,136,0.3);
  animation: slideDown 0.25s cubic-bezier(.2,.7,.2,1);
}
.merge-mode-banner .info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.merge-mode-banner .info .num {
  background: white;
  color: var(--teal-700);
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  flex-shrink: 0;
}
.merge-mode-banner .cancel-btn {
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.18);
  color: white;
  flex-shrink: 0;
}
.merge-mode-banner .cancel-btn:hover { background: rgba(255,255,255,0.28); }

/* Merge mode-ban a table-card kijelölhető */
.table-card.merge-selected {
  border-color: var(--teal-600) !important;
  background: var(--teal-50) !important;
  box-shadow: 0 0 0 3px rgba(13,148,136,0.18) !important;
  transform: translateY(-2px);
}
.table-card.merge-selected::after {
  content: "✓";
  position: absolute;
  top: 8px; right: 8px;
  width: 26px; height: 26px;
  background: var(--teal-600);
  color: white;
  border-radius: 50%;
  font-size: 15px;
  font-weight: 700;
  display: grid;
  place-items: center;
  box-shadow: 0 2px 4px -1px rgba(13,148,136,0.4);
  animation: badgePop 0.2s cubic-bezier(.2,1.6,.4,1);
}
.table-card.merge-disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.4);
}
.table-card.merge-disabled:hover {
  transform: none;
  border-color: var(--border);
  box-shadow: var(--shadow-sm);
}

/* Slave asztal (egy csoport alszerve) */
.table-card.merged-slave {
  background: linear-gradient(180deg, var(--teal-50), var(--surface)) !important;
  border: 1.5px dashed var(--teal-300) !important;
}
.table-card.merged-slave .table-num {
  color: var(--ink-400) !important;
  font-size: 28px !important;
}
.table-card.merged-slave:hover {
  border-color: var(--teal-500) !important;
}

/* Master asztal (csoport feje) */
.table-card.merged-master {
  background: linear-gradient(180deg, var(--teal-50), var(--surface)) !important;
  border-color: var(--teal-300) !important;
  position: relative;
}
.table-card.merged-master.occupied {
  background: linear-gradient(180deg, var(--amber-50), var(--teal-50)) !important;
}

.merge-link-badge,
.merge-group-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--teal-700);
  background: var(--teal-100);
  padding: 3px 8px;
  border-radius: 999px;
  align-self: flex-start;
}
.merge-link-badge { margin-top: 4px; }
.merge-group-label { margin-bottom: 6px; }

/* Group-info chip a Split / Order / Payment screen-en */
.group-info-bar {
  background: linear-gradient(135deg, var(--teal-50), var(--teal-100));
  border: 1px solid var(--teal-300);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  flex-wrap: wrap;
}
.group-info-bar .gi-text {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--teal-700);
  font-weight: 600;
  flex: 1;
  min-width: 0;
}
.group-info-bar .gi-text .gi-ico { font-size: 16px; line-height: 1; }
.group-info-bar .gi-text strong { color: var(--teal-700); font-weight: 700; }
.group-info-bar .gi-unmerge {
  padding: 7px 12px;
  background: var(--surface);
  border: 1px solid var(--teal-500);
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--teal-700);
  transition: all 0.15s;
  white-space: nowrap;
}
.group-info-bar .gi-unmerge:hover {
  background: var(--teal-600);
  color: white;
  border-color: var(--teal-600);
}

/* ====================================================
   UTILITIES
   ====================================================*/
.hidden { display: none !important; }
.mono { font-family: var(--font-mono); }

/* Print rules — when user prints the page */
@media print {
  .topbar, .bottom-bar, .modal-overlay, #toast-root, .modal-actions, .modal-head .modal-close { display: none !important; }

    </div>
    <div class="topbar-spacer"></div>

    <button class="topbar-btn" id="resetBtn" title="Demó újraindítása">

<script>
'use strict';

/* =====================================================
   DATA — MENU
   ===================================================== */

/* =====================================================

let uidCounter = 1;
function makeUnits(items) {
  const out = [];
  for (const [menuId, qty] of items) {
    for (let i = 0; i < qty; i++) out.push({ uid: 'u' + (uidCounter++), menuId });
  }
  return out;
}

function createInitialState() {
  const tables = {};
  for (let i = 1; i <= TABLE_COUNT; i++) {
    tables[i] = {
      status: 'free', guests: 0, orderUnits: [], openedAt: null,
      mergedInto: null,   // ha != null → ez egy slave, a master id-je
      mergedWith: null,   // ha != null → ez egy master, az összes csoporttag id-je (sorted, master is benne)
    };
  }
  // Pre-populated tables (a merged mezők a `mergedInto: null, mergedWith: null` default)

    status: 'occupied', guests: 4,

      ['ma1', 2], ['ma2', 1], ['ma6', 1],
      ['dr1', 2], ['dr2', 2], ['dr5', 2],
      ['de1', 1], ['de2', 1],

    orderUnits: makeUnits([

/* =====================================================
   HELPERS
   ===================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const menuOf = id => MENU.find(m => m.id === id);
function fmtFt(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' Ft';
}
function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function tableTotal(tid) {
  const t = state.tables[tid]; if (!t) return 0;
  return t.orderUnits.reduce((s,u) => s + menuOf(u.menuId).price, 0);
}
function billTotal(uids) {
  const t = state.tables[state.currentTableId]; if (!t) return 0;
  return uids.reduce((s,uid) => {
    const u = t.orderUnits.find(x => x.uid === uid);
    return s + (u ? menuOf(u.menuId).price : 0);
  }, 0);
}
function orderCartTotal() {
  return state.orderCart.reduce((s,r) => s + menuOf(r.menuId).price * r.qty, 0);
}
function orderCartCount() {
  return state.orderCart.reduce((s,r) => s + r.qty, 0);
}
function minsAgo(ts) {
  return Math.max(1, Math.floor((Date.now() - ts) / 60000));
}
function genRef(billIdx) {
  const tid = state.currentTableId || 0;
  const ts = Date.now().toString(36).toUpperCase().slice(-5);
  return `T${tid}B${billIdx+1}-${ts}`;
}

/* Csoportosított tételek a megadott uid-listából,
   a RECEIPT_CATEGORIES_ORDER sorrendben.
   Vissza: [ { cat, items: [{ menu, qty, subtotal }, ...], catSubtotal } ] */
function groupUidsByCategory(uids) {
  const t = state.tables[state.currentTableId];
  if (!t) return [];
  const units = t.orderUnits.filter(u => uids.includes(u.uid));
  // Csoportosítás kategória + menüid alapján
  const byCat = {};
  units.forEach(u => {
    const m = menuOf(u.menuId);
    if (!byCat[m.cat]) byCat[m.cat] = {};
    if (!byCat[m.cat][m.id]) byCat[m.cat][m.id] = { menu: m, qty: 0 };
    byCat[m.cat][m.id].qty++;
  });
  const out = [];
  for (const cat of RECEIPT_CATEGORIES_ORDER) {
    if (!byCat[cat]) continue;
    const items = Object.values(byCat[cat])
      .sort((a,b) => a.menu.name.localeCompare(b.menu.name))
      .map(it => ({ ...it, subtotal: it.menu.price * it.qty }));
    const catSubtotal = items.reduce((s,it) => s + it.subtotal, 0);
    out.push({ cat, items, catSubtotal });
  }
  return out;
}

function billTipPercent(billIdx) {
  return state.payTips[billIdx] || 0;
}
function billTipAmount(billIdx) {
  const subtotal = billTotal(state.bills[billIdx]);
  return Math.round(subtotal * billTipPercent(billIdx) / 100);
}
function billGrandTotal(billIdx) {
  return billTotal(state.bills[billIdx]) + billTipAmount(billIdx);
}

/* =====================================================
   MERGE HELPERS (asztal-összevonás)
   ===================================================== */
function isSlave(tid) {
  const t = state.tables[tid];
  return !!(t && t.mergedInto);
}
function isMaster(tid) {
  const t = state.tables[tid];
  return !!(t && t.mergedWith && t.mergedWith.length > 1);
}
function isMerged(tid) {
  return isMaster(tid) || isSlave(tid);
}
function getMasterId(tid) {
  const t = state.tables[tid];
  if (!t) return tid;
  return t.mergedInto || tid;
}
function getGroupMembers(tid) {
  const masterId = getMasterId(tid);
  const m = state.tables[masterId];
  if (m && m.mergedWith && m.mergedWith.length > 1) return m.mergedWith.slice();
  return [tid];
}
/* Formátum: "4–5. asztal" vagy "4–5–6. asztal" csoportra; "4. asztal" önálló asztalra */
function groupLabel(tid) {
  const members = getGroupMembers(tid).sort((a, b) => a - b);
  if (members.length === 1) return members[0] + '. asztal';
  return members.join('–') + '. asztal';
}

/* =====================================================
   TOAST
   ===================================================== */
function toast(msg, opts = {}) {
  const { type = 'info', duration = 2400 } = opts;
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ⓘ';
  el.innerHTML = `<span class="ico">${icon}</span><span class="body">${msg}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, duration);
}

/* =====================================================
   ROUTER / RENDER
   ===================================================== */
function goTo(screen) {
  // Normalize billsPaid when entering payment so allPaid logic is correct
  if (screen === 'payment') {
    while (state.billsPaid.length < state.bills.length) state.billsPaid.push(null);
    state.billsPaid.length = state.bills.length;
  }
  state.screen = screen;
  state.cartSheetOpen = false;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function render() {
  const root = $('#screen-root');
  const bar = $('#bottom-bar');

  // Clear any stale drag elements
  clearDragGhost();

  switch (state.screen) {
    case 'tables':  root.innerHTML = renderTables();  break;
    case 'order':   root.innerHTML = renderOrder();   break;
    case 'split':   root.innerHTML = renderSplit();   bindSplitInteractions(); break;
    case 'payment': root.innerHTML = renderPayment(); break;
    case 'closed':  root.innerHTML = renderClosed();  break;
  }

  renderBottomBar(bar);
  renderModal();
}

/* =====================================================
   SCREEN: TABLES
   ===================================================== */
function renderTables() {
  const mergeMode = state.mergeMode;
  const cards = [];

  for (let i = 1; i <= TABLE_COUNT; i++) {
    const t = state.tables[i];

    // ===== MERGE MODE rendering =====
    if (mergeMode) {
      const isFree = t.status === 'free';
      const merged = isMerged(i);
      const isSelectable = isFree && !merged;
      const isSelected = state.mergeSelected.has(i);
      const stateClass = isFree ? 'free' : 'occupied';
      const interactClass = isSelectable
        ? (isSelected ? 'merge-selected' : '')
        : 'merge-disabled';
      const badge = merged
        ? `<div class="table-badge" style="color:var(--teal-700)">Csoport</div>`
        : isFree
        ? `<div class="table-badge">Szabad</div>`
        : `<div class="table-badge">${t.guests} fő</div>`;
      cards.push(`
        <button class="table-card ${stateClass} ${interactClass}" onclick="toggleMergeSelect(${i})">
          <div class="table-num">${i}<small>. asztal</small></div>
          <div class="table-info">
            ${badge}
            <div class="table-meta">
              <span>${isSelectable ? (isSelected ? 'Kijelölve ✓' : 'Koppints a kijelöléshez') : merged ? `↪ ${getMasterId(i)}. csoport` : 'Foglalt'}</span>
            </div>
          </div>
        </button>
      `);
      continue;
    }

    // ===== NORMAL rendering =====
    if (isSlave(i)) {
      const masterId = getMasterId(i);
      cards.push(`
        <button class="table-card merged-slave" onclick="enterTable(${i})">
          <div class="table-num">${i}<small>. asztal</small></div>
          <div class="table-info">
            <div class="merge-link-badge">🔗 ${masterId}. csoport</div>
            <div class="table-meta"><span>Csoport tag</span></div>
          </div>
        </button>
      `);
      continue;
    }
    if (isMaster(i)) {
      const label = t.mergedWith.join('–');
      const memberCount = t.mergedWith.length;
      if (t.status === 'free') {
        cards.push(`
          <button class="table-card free merged-master" onclick="enterTable(${i})">
            <div class="merge-group-label">🔗 ${label}. asztal</div>
            <div class="table-num">${i}<small>. csoport</small></div>
            <div class="table-info">
              <div class="table-badge" style="color:var(--teal-700)">${memberCount} asztal · új vendég</div>
            </div>
          </button>
        `);
      } else {
        const mins = minsAgo(t.openedAt);
        const tot = tableTotal(i);
        cards.push(`
          <button class="table-card occupied merged-master" onclick="enterTable(${i})">
            <div class="merge-group-label">🔗 ${label}. asztal</div>
            <div class="table-num">${i}<small>. csoport</small></div>
            <div class="table-info">
              <div class="table-badge">${t.guests} fő · ${memberCount} asztal</div>
              <div class="table-meta"><span>${mins} perce</span><strong>${fmtFt(tot)}</strong></div>
            </div>
          </button>
        `);
      }
      continue;
    }

    // Standalone (nem merge-elt)
    if (t.status === 'free') {
      cards.push(`
        <button class="table-card free" onclick="enterTable(${i})">
          <div class="table-num">${i}<small>. asztal</small></div>
          <div class="table-info">
            <div class="table-badge">Szabad</div>
            <div class="table-meta"><span>Új vendég</span></div>
          </div>
        </button>
      `);
    } else {
      const mins = minsAgo(t.openedAt);
      const tot = tableTotal(i);
      cards.push(`
        <button class="table-card occupied" onclick="enterTable(${i})">
          <div class="table-num">${i}<small>. asztal</small></div>
          <div class="table-info">
            <div class="table-badge">${t.guests} fő</div>
            <div class="table-meta"><span>${mins} perce</span><strong>${fmtFt(tot)}</strong></div>
          </div>
        </button>
      `);
    }
  }

  // Header — merge módban más
  if (mergeMode) {
    return `
      <div class="screen">
        <div class="merge-mode-banner">
          <div class="info">
            <div class="num">${state.mergeSelected.size}</div>
            <span>Koppints szabad asztalokra az összevonáshoz</span>
          </div>
          <button class="cancel-btn" onclick="exitMergeMode()">Mégse</button>
        </div>
        <div class="screen-head">
          <h1>Asztalok <em>összevonása</em></h1>
          <p>Csak szabad, még össze nem vont asztalokat választhatsz. A legkisebb sorszám lesz a csoport feje.</p>
        </div>
        <div class="tables-grid">${cards.join('')}</div>
      </div>
    `;
  }

  // Normál mód
  return `
    <div class="screen">
      <div class="screen-head">
        <h1>Asztalok</h1>
        <p>Koppints egy asztalra a rendelés vagy számla megnyitásához.</p>
      </div>
      <div class="merge-bar">
        <div class="legend-pair">
          <span class="dot free">Szabad</span>
          <span class="dot occupied">Foglalt</span>
          <span class="dot merged">Összevont</span>
        </div>
        <button class="merge-btn-trigger" onclick="enterMergeMode()">
          <span class="ico">🔗</span>Asztalok összevonása
        </button>
      </div>
      <div class="tables-grid">${cards.join('')}</div>
      <div class="action-hint">
        <span class="ico">⚡</span>
        <span><strong>Gyors demó:</strong> a 3., 5. és 6. asztalon már nyitott rendelés van — koppints rájuk, hogy egyből a számla-szétosztáshoz ugorj. Két szabad asztal összevonásához nyomd meg a <strong>🔗 gombot</strong>.</span>
      </div>
    </div>
  `;
}

function enterTable(id) {
  // Merge módban a kattintás kijelölést jelent, nem belépést
  if (state.mergeMode) { toggleMergeSelect(id); return; }
  // Slave asztalra kattintva a masterre ugrunk
  const tid = getMasterId(id);
  state.currentTableId = tid;
  const t = state.tables[tid];
  if (t.status === 'free') {
    state.orderCart = [];
    state.orderGuests = 2;
    state.activeCat = 'Főétel';
    goTo('order');
  } else {
    // Direct to split with empty first bill
    state.bills = [[]];
    state.selectedUids = new Set();
    state.billsPaid = [];
    state.paySelection = {};
    state.payTips = {};
    state.receiptsByBill = [];
    goTo('split');
  }
}

/* =====================================================
   MERGE MODE (asztal-összevonás)
   ===================================================== */
function enterMergeMode() {
  state.mergeMode = true;
  state.mergeSelected = new Set();
  render();
}
function exitMergeMode() {
  state.mergeMode = false;
  state.mergeSelected = new Set();
  render();
}
function toggleMergeSelect(tid) {
  const t = state.tables[tid];
  if (!t) return;
  // Csak szabad, még nem összevont asztal jelölhető ki
  if (t.status !== 'free' || isMerged(tid)) {
    if (isMerged(tid)) toast('Ez az asztal már egy csoport része', { type: 'error', duration: 1800 });
    else toast('Foglalt asztalt nem lehet összevonni', { type: 'error', duration: 1800 });
    return;
  }
  if (state.mergeSelected.has(tid)) state.mergeSelected.delete(tid);
  else state.mergeSelected.add(tid);
  render();
}
function confirmMerge() {
  const ids = Array.from(state.mergeSelected).sort((a, b) => a - b);
  if (ids.length < 2) {
    toast('Legalább 2 asztal kell az összevonáshoz', { type: 'error' });
    return;
  }
  const masterId = ids[0];
  state.tables[masterId].mergedWith = ids;
  state.tables[masterId].mergedInto = null;
  for (let i = 1; i < ids.length; i++) {
    state.tables[ids[i]].mergedInto = masterId;
    state.tables[ids[i]].mergedWith = null;
  }
  state.mergeMode = false;
  state.mergeSelected = new Set();
  render();
  toast(`Asztalok összevonva: ${ids.join('–')}. asztal ✓`, { type: 'success' });
}
function askUnmerge() {
  state.modal = { type: 'unmerge-confirm' };
  render();
}
function cancelUnmerge(e) {
  if (e && e.target !== e.currentTarget && !e.target.closest('.modal-close')) return;
  state.modal = null;
  render();
}
function unmergeGroup() {
  const tid = state.currentTableId;
  const masterId = getMasterId(tid);
  const t = state.tables[masterId];
  if (!t || !t.mergedWith) { state.modal = null; render(); return; }
  const members = t.mergedWith.slice();
  for (const id of members) {
    if (id !== masterId) {
      state.tables[id].mergedInto = null;
      state.tables[id].mergedWith = null;
    }
  }
  t.mergedWith = null;
  state.modal = null;
  render();
  toast(`Csoport feloldva — a tételek a(z) ${masterId}. asztalon maradnak`, { type: 'success' });
}

      <div class="cat-tabs">${catTabs}</div>
      <div class="menu-grid">${menuItems}</div>
      ${cartPreview}
    </div>
  `;
}

function setCat(c) {
  state.activeCat = c;
  // Just re-render the order screen without full state reset
  render();
}
function addToCart(menuId) {
  const existing = state.orderCart.find(r => r.menuId === menuId);
  if (existing) existing.qty++;
  else state.orderCart.push({ menuId, qty: 1 });
  render();
}
function changeCartQty(menuId, delta) {
  const idx = state.orderCart.findIndex(r => r.menuId === menuId);
  if (idx < 0) return;
  state.orderCart[idx].qty += delta;
  if (state.orderCart[idx].qty <= 0) state.orderCart.splice(idx, 1);
  // Close sheet if empty
  if (state.orderCart.length === 0) state.cartSheetOpen = false;
  render();
}
function changeGuests(d) {
  state.orderGuests = Math.max(1, state.orderGuests + d);
  render();
}
function toggleCartSheet() {
  state.cartSheetOpen = !state.cartSheetOpen;
  render();
}
function saveOrder() {
  const tid = state.currentTableId;
  if (state.orderCart.length === 0) return;
  const t = state.tables[tid];
  t.guests = state.orderGuests;
  t.status = 'occupied';
  t.openedAt = Date.now();
  t.orderUnits = makeUnits(state.orderCart.map(r => [r.menuId, r.qty]));
  state.orderCart = [];
  state.cartSheetOpen = false;
  toast(`Rendelés rögzítve — ${t.orderUnits.length} tétel, ${fmtFt(tableTotal(tid))}`, { type:'success' });
  state.bills = [[]];
  state.selectedUids = new Set();
  state.billsPaid = [];
  state.paySelection = {};
  state.payTips = {};
  state.receiptsByBill = [];
  goTo('split');
}

/* =====================================================
   SCREEN: SPLIT — TAP-TO-ASSIGN PRIMARY UX
   ===================================================== */
function renderSplit() {
  const tid = state.currentTableId;
  const t = state.tables[tid];

  // Determine assigned vs unassigned
  const assignedSet = new Set();
  state.bills.forEach(b => b.forEach(uid => assignedSet.add(uid)));
  const unassigned = allUnits.filter(u => !assignedSet.has(u.uid));
  const unassignedTotal = unassigned.reduce((s,u) => s + menuOf(u.menuId).price, 0);
  const total = tableTotal(tid);

        ${unassigned.length === 0
          ? `<div class="bin-empty">Minden tétel szét van osztva ✓</div>`
          : unassigned.map(renderDish).join('')}
      </div>
      <div class="bin-footer">
        <span class="lbl">Részösszeg</span>
        <span class="val">${fmtFt(unassignedTotal)}</span>
      </div>
    </div>
  `;

  const billBins = state.bills.map((uids, idx) => {
    const colorIdx = idx % BILL_COLORS.length;
    const units = allUnits.filter(u => uids.includes(u.uid));
    const tot = billTotal(uids);
    const canDel = state.bills.length > 1;
    const targetClass = hasSelection ? 'target-active' : '';
    return `
      <div class="bin bin-bill ${targetClass}" data-dropzone="bill" data-bill-idx="${idx}" data-color="${colorIdx}">
        <div class="bin-header">
          <div class="bin-title"><span class="marker"></span>${idx+1}. Számla</div>
          <div class="bin-actions">
            <span class="bin-count">${units.length} db</span>
            ${canDel ? `<button class="bin-del" onclick="event.stopPropagation();removeBill(${idx})" aria-label="Számla törlése">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>` : ''}
          </div>
        </div>
        <div class="bin-items">
          ${units.length === 0
            ? `<div class="bin-empty">Üres számla — koppints ide a kijelölt tételek hozzárendeléséhez</div>`
            : units.map(renderDish).join('')}
        </div>
        <div class="bin-footer">
          <span class="lbl">Részösszeg</span>
          <span class="val">${fmtFt(tot)}</span>
        </div>

  const addBtn = state.bills.length < 4 ? `
    <button class="add-bill-btn" onclick="addBill()">

        Asztalok
      </a>
      <div class="screen-head">

      ${isMaster(tid) ? `
