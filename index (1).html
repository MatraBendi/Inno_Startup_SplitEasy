function renderSplitQuickActions(t, unassigned, allUnits) {
  const n = t.guests || 1;
  const totalUnits = allUnits.length;
  const drinkUnitsAll = allUnits.filter(u => menuOf(u.menuId).cat === 'Ital');
  // A "gyors gombok" akkor használhatók, ha még van mit szétosztani vagy
  // ha még csak az 1. üres számlában vagyunk (= alaphelyzet)
  const splitAllDisabled = n < 2 || totalUnits === 0;
  const splitDrinksDisabled = n < 2 || drinkUnitsAll.length === 0;
  return `
    <div class="split-quick-actions">
      <div class="qa-label">
        Gyors szétosztás
        <span class="badge">${n} fő</span>
      </div>
      <div class="qa-buttons">
        <button class="qa-btn" onclick="autoSplitEqual()" ${splitAllDisabled?'disabled':''} title="Minden tételt egyenletesen szétoszt ${n} számlára">
          <span class="ico">⚖️</span>
          Egyenlő részekre
          <small>${n} számla, ~azonos összeg</small>
        </button>
        <button class="qa-btn" onclick="autoSplitDrinks()" ${splitDrinksDisabled?'disabled':''} title="Csak az italokat osztja szét ${n} számlára">
          <span class="ico">🥤</span>
          Italok megosztva
          <small>${drinkUnitsAll.length} ital, ${n} fő között</small>
        </button>
      </div>
    </div>
  `;
}

function bindSplitInteractions() {
  const root = $('#screen-root');
  // Click on a dish — toggle selection (unless we just finished a drag)
  root.querySelectorAll('.dish').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      // Suppress click if drag just happened
      if (window._splitJustDragged) {
        window._splitJustDragged = false;
        return;
      }
      const uid = el.dataset.uid;
      if (state.selectedUids.has(uid)) {
        state.selectedUids.delete(uid);
      } else {
        state.selectedUids.add(uid);
      }
      render();
    });

    // Drag (long-press on touch, 12px on mouse)
    el.addEventListener('pointerdown', onDragStart);
  });

  // Click on a bin background (when there's a selection) — assign
  root.querySelectorAll('[data-dropzone]').forEach(bin => {
    bin.addEventListener('click', (e) => {
      // Ignore if click was inside a dish (handled above) or button
      if (e.target.closest('.dish')) return;
      if (e.target.closest('button')) return;
      // Suppress if drag just happened
      if (window._splitJustDragged) {
        window._splitJustDragged = false;
        return;
      }
      if (state.selectedUids.size === 0) return;
      const zone = bin.dataset.dropzone;
      if (zone === 'pool') {
        moveSelectedToPool();
      } else if (zone === 'bill') {
        const idx = parseInt(bin.dataset.billIdx, 10);
        moveSelectedToBill(idx);
      }
    });
  });
}

function clearSelection() {
  state.selectedUids = new Set();
  render();
}

function moveSelectedToBill(billIdx) {
  if (state.selectedUids.size === 0) return;
  // Remove these uids from any other bill
  state.bills.forEach(b => {
    for (const uid of state.selectedUids) {
      const i = b.indexOf(uid);
      if (i >= 0) b.splice(i, 1);
    }
  });
  // Add to target
  for (const uid of state.selectedUids) {
    if (!state.bills[billIdx].includes(uid)) {
      state.bills[billIdx].push(uid);
    }
  }
  const count = state.selectedUids.size;
  state.selectedUids = new Set();
  render();
  toast(`${count} tétel → ${billIdx+1}. számla`, { type:'success', duration: 1500 });
}

function moveSelectedToPool() {
  if (state.selectedUids.size === 0) return;
  state.bills.forEach(b => {
    for (const uid of state.selectedUids) {
      const i = b.indexOf(uid);
      if (i >= 0) b.splice(i, 1);
    }
  });
  const count = state.selectedUids.size;
  state.selectedUids = new Set();
  render();
  toast(`${count} tétel vissza a szétosztatlan közé`, { type:'info', duration: 1500 });
}

function addBill() {
  if (state.bills.length >= 4) return;
  state.bills.push([]);
  render();
}
function removeBill(idx) {
  if (state.bills.length <= 1) return;
  const removed = state.bills.splice(idx, 1)[0];
  if (removed.length > 0) {
    toast(`Számla törölve — ${removed.length} tétel visszakerült`, { type:'info' });
  }
  render();
}
function leaveSplit() {
  state.selectedUids = new Set();
  state.bills = [];
  goTo('tables');
}

/* =====================================================
   AUTO-SPLIT — gyors gombok
   ===================================================== */

/* Minden tételt szétoszt N számlára úgy, hogy az összegek minél
   közelebb legyenek egymáshoz. Longest-Processing-Time (LPT) heurisztika:
   ár szerint csökkenő sorrendben mindig a pillanatnyilag legolcsóbb
   számlára tesszük a következő tételt. */
function autoSplitEqual() {
  const tid = state.currentTableId;
  const t = state.tables[tid];
  if (!t) return;
  const n = t.guests || 1;
  if (n < 2) {
    toast('Legalább 2 fő szükséges', { type: 'error' });
    return;
  }
  if (t.orderUnits.length === 0) {
    toast('Nincs szétosztható tétel', { type: 'error' });
    return;
  }
  // N db üres számla
  const newBills = Array.from({ length: n }, () => []);
  const newTotals = Array(n).fill(0);

  // Ár szerint csökkenő sorrend (LPT) — drága tételek mehetnek először
  const sorted = t.orderUnits
    .slice()
    .sort((a, b) => menuOf(b.menuId).price - menuOf(a.menuId).price);

  for (const u of sorted) {
    // Legolcsóbb számlára tesszük (egyenlő esetben az alacsonyabb indexre)
    let minIdx = 0;
    for (let i = 1; i < n; i++) {
      if (newTotals[i] < newTotals[minIdx]) minIdx = i;
    }
    newBills[minIdx].push(u.uid);
    newTotals[minIdx] += menuOf(u.menuId).price;
  }

  state.bills = newBills;
  state.selectedUids = new Set();
  state.billsPaid = [];
  state.paySelection = {};
  state.payTips = {};
  state.receiptsByBill = [];

  const min = Math.min(...newTotals);
  const max = Math.max(...newTotals);
  const diff = max - min;
  render();
  toast(`Egyenlő szétosztás ✓ ${n} számla, eltérés: ${fmtFt(diff)}`, { type:'success' });
}

/* Csak az italokat osztja szét N számlára, körkörösen.
   Ha még nincs elég számla, kibővíti N-re (max 4).
   A nem-italok érintetlenek maradnak (ott, ahol most vannak). */
function autoSplitDrinks() {
  const tid = state.currentTableId;
  const t = state.tables[tid];
  if (!t) return;
  const n = t.guests || 1;
  if (n < 2) {
    toast('Legalább 2 fő szükséges', { type: 'error' });
    return;
  }
  const drinkUids = t.orderUnits
    .filter(u => menuOf(u.menuId).cat === 'Ital')
    .map(u => u.uid);

  if (drinkUids.length === 0) {
    toast('Nincs ital a rendelésben', { type: 'error' });
    return;
  }

  // A célszámlák száma legfeljebb 4 lehet (UX/szín-korlát)
  const targetBills = Math.min(n, 4);
  if (n > 4) {
    toast(`${n} fő > 4 (max számla), ${targetBills} számlára osztva`, { duration: 3000 });
  }

  // Biztosítjuk, hogy legalább targetBills üres/meglévő számla van
  while (state.bills.length < targetBills) state.bills.push([]);

  // Eltávolítjuk az italokat minden számláról és a poolból (a uids már nem szerepelnek sehol)
  state.bills.forEach(b => {
    for (let i = b.length - 1; i >= 0; i--) {
      if (drinkUids.includes(b[i])) b.splice(i, 1);
    }
  });

  // Ár szerint csökkenő sorrendben round-robin a legolcsóbb számlára (LPT az italokra)
  const drinkUnitsSorted = drinkUids
    .map(uid => t.orderUnits.find(u => u.uid === uid))
    .sort((a, b) => menuOf(b.menuId).price - menuOf(a.menuId).price);

  // Csak a célszámlákra (0..targetBills-1) osztjuk, az ott levő nem-ital
  // tételeket is figyelembe véve a "legkevesebb ital összeg" számításhoz.
  const drinkTotals = Array(targetBills).fill(0);
  for (const u of drinkUnitsSorted) {
    let minIdx = 0;
    for (let i = 1; i < targetBills; i++) {
      if (drinkTotals[i] < drinkTotals[minIdx]) minIdx = i;
    }
    state.bills[minIdx].push(u.uid);
    drinkTotals[minIdx] += menuOf(u.menuId).price;
  }

  state.selectedUids = new Set();
  render();
  const perBill = Math.round(drinkTotals.reduce((s,v)=>s+v,0) / targetBills);
  toast(`Italok szétosztva ✓ ${drinkUids.length} ital · ${targetBills} fő (~${fmtFt(perBill)}/fő)`, { type:'success' });
}

/* =====================================================
   DRAG & DROP — long-press based (preserves scroll)
   ===================================================== */
let drag = null;
let dragHoverBin = null;
const LONG_PRESS_MS = 380;  // hold this long to start drag
const SCROLL_CANCEL_PX = 10; // if user moves more than this before long-press fires, treat as scroll

function clearDragGhost() {
  if (drag) {
    if (drag.longPressTimer) {
      clearTimeout(drag.longPressTimer);
      drag.longPressTimer = null;
    }
    if (drag.ghost) drag.ghost.remove();
    if (drag.el) {
      drag.el.classList.remove('dragging');
      drag.el.classList.remove('long-pressing');
    }
    drag = null;
  }
  if (dragHoverBin) {
    dragHoverBin.classList.remove('drop-hover');
    dragHoverBin = null;
  }
}

function onDragStart(e) {
  // Only main button on mouse
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  const el = e.currentTarget;
  const uid = el.dataset.uid;
  const startX = e.clientX;
  const startY = e.clientY;
  const pointerId = e.pointerId;
  const isTouch = e.pointerType === 'touch';

  // Long-press detection
  let dragStarted = false;
  let cancelled = false;
  let ghost = null;

  const dragState = {
    uid, el, pointerId,
    ghost: null,
    offsetX: 0,
    offsetY: 0,
    longPressTimer: null,
    isTouch,
  };
  drag = dragState;

  // Visual feedback during long-press wait
  el.classList.add('long-pressing');

  const startDrag = () => {
    if (cancelled) return;
    dragStarted = true;

    // Provide haptic feedback if available
    if (navigator.vibrate) {
      try { navigator.vibrate(15); } catch (_) {}
    }

    el.classList.remove('long-pressing');
    el.classList.add('dragging');

    // Create ghost element
    const rect = el.getBoundingClientRect();
    const unit = state.tables[state.currentTableId].orderUnits.find(u => u.uid === uid);
    if (!unit) return;
    const m = menuOf(unit.menuId);
    ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.innerHTML = `
      <div class="em" style="font-size:22px;">${m.emoji}</div>
      <div class="nm" style="font-weight:600;color:var(--ink-900);">${m.name}</div>
      <div class="pr" style="font-family:var(--font-mono);font-weight:600;color:var(--teal-700);font-size:13px;">${fmtFt(m.price)}</div>
    `;
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.offsetX = startX - rect.left;
    dragState.offsetY = startY - rect.top;
  };

  // Schedule long-press
  dragState.longPressTimer = setTimeout(startDrag, LONG_PRESS_MS);

  const onMove = (ev) => {
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // If touch: any movement before long-press = scrolling, cancel drag
    if (!dragStarted && isTouch && dist > SCROLL_CANCEL_PX) {
      cancelDrag();
      return;
    }
    // For mouse: small movement is OK, we trigger drag if 12+px (still useful for desktop)
    if (!dragStarted && !isTouch && dist > 12) {
      // Cancel long-press timer and start drag immediately
      clearTimeout(dragState.longPressTimer);
      startDrag();
    }

    // Update ghost position
    if (dragStarted && ghost) {
      ev.preventDefault();
      ghost.style.left = (ev.clientX - dragState.offsetX) + 'px';
      ghost.style.top  = (ev.clientY - dragState.offsetY) + 'px';

      // Find hover bin
      ghost.style.display = 'none';
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      ghost.style.display = '';
      const bin = under ? under.closest('[data-dropzone]') : null;

      if (bin !== dragHoverBin) {
        if (dragHoverBin) dragHoverBin.classList.remove('drop-hover');
        dragHoverBin = bin;
        if (dragHoverBin) dragHoverBin.classList.add('drop-hover');
      }
    }
  };

  const onUp = (ev) => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', cancelDrag);

    if (cancelled) return;

    // Cancel long-press timer if still pending
    if (dragState.longPressTimer) {
      clearTimeout(dragState.longPressTimer);
      dragState.longPressTimer = null;
    }

    if (dragStarted) {
      window._splitJustDragged = true;
      // Process drop
      if (ghost) {
        ghost.style.display = 'none';
        const under = document.elementFromPoint(ev.clientX, ev.clientY);
        ghost.style.display = '';
        const bin = under ? under.closest('[data-dropzone]') : null;
        if (bin) {
          const zone = bin.dataset.dropzone;
          if (zone === 'bill') {
            const billIdx = parseInt(bin.dataset.billIdx, 10);
            state.selectedUids.add(uid);
            moveSelectedToBill(billIdx);
            return;
          } else if (zone === 'pool') {
            state.selectedUids.add(uid);
            moveSelectedToPool();
            return;
          }
        }
      }
      clearDragGhost();
      render();
    } else {
      // Tap — let click handler take it (don't preventDefault)
      el.classList.remove('long-pressing');
      drag = null;
    }
  };

  const cancelDrag = () => {
    cancelled = true;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', cancelDrag);
    clearDragGhost();
  };

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', cancelDrag);
}

/* =====================================================
   SCREEN: PAYMENT
   ===================================================== */
function renderPayment() {
  const tid = state.currentTableId;
  const t = state.tables[tid];

  const cards = state.bills.map((uids, idx) => {
    const colorIdx = idx % BILL_COLORS.length;
    const subtotal = billTotal(uids);
    const tipPct = billTipPercent(idx);
    const tipAmt = billTipAmount(idx);
    const grandTotal = subtotal + tipAmt;
    const paid = state.billsPaid[idx];
    const sel = state.paySelection[idx];

    // Kategóriánként csoportosított rendelési összesítő
    const grouped = groupUidsByCategory(uids);
    let itemsHTML = '';
    if (grouped.length === 0) {
      itemsHTML = `<div class="row"><span>Üres számla</span></div>`;
    } else {
      itemsHTML = grouped.map(g => {
        const meta = CATEGORY_META[g.cat];
        const rows = g.items.map(it =>
          `<div class="row"><span>${it.menu.emoji} ${it.menu.name} × ${it.qty}</span><span class="mono">${fmtFt(it.subtotal)}</span></div>`
        ).join('');
        return `<div class="cat-head"><span class="ico">${meta.icon}</span>${meta.label}</div>${rows}`;
      }).join('');
    }

    const methodsHTML = PAYMENT_METHODS.map(pm => {
      const isSel = sel === pm.id;
      return `<button class="pm-btn ${isSel?'selected':''}" ${paid?'disabled':''} onclick="selectPayMethod(${idx},'${pm.id}')">
        <span class="ico">${pm.emoji}</span>${pm.label}
      </button>`;
    }).join('');

    // Borravaló választó
    const tipBtns = TIP_OPTIONS.map(p => {
      const isSel = tipPct === p;
      const label = p === 0 ? 'Nincs' : `${p}%`;
      return `<button class="tip-btn ${isSel?'selected':''}" ${paid?'disabled':''} onclick="selectTip(${idx}, ${p})">${label}</button>`;
    }).join('');
    const tipSelectorHTML = uids.length === 0 ? '' : `
      <div class="tip-selector">
        <div class="tip-label">
          <span>Borravaló</span>
          <span class="amt">${tipPct > 0 ? `+ ${fmtFt(tipAmt)}` : '—'}</span>
        </div>
        <div class="tip-options">${tipBtns}</div>
      </div>
    `;

    // Részletes összesítő — csak akkor mutatjuk, ha van borravaló (másképp redundáns)
    const breakdownHTML = uids.length === 0 ? '' : `
      <div class="pay-breakdown">
        <div class="row"><span>Részösszeg</span><span class="mono">${fmtFt(subtotal)}</span></div>
        ${tipPct > 0 ? `<div class="row tip-row"><span>Borravaló (${tipPct}%)</span><span class="mono">+ ${fmtFt(tipAmt)}</span></div>` : ''}
        <div class="row grand"><span>Fizetendő</span><span class="mono">${fmtFt(grandTotal)}</span></div>
      </div>
    `;

    let statusHTML;
    if (paid) {
      statusHTML = `
        <div class="pay-status done">
          <span class="ico">✓</span>Fizetve · ${paid.method}
        </div>
        <button class="btn btn-ghost btn-sm" style="width:100%;" onclick="openReceipt(${idx})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Nyugta megtekintése
        </button>
      `;
    } else if (sel) {
      const actionLabel = sel === 'qr' ? `QR-kód generálása · ${fmtFt(grandTotal)}` : `Fizetés rögzítése · ${fmtFt(grandTotal)}`;
      statusHTML = `<button class="btn btn-primary btn-block" onclick="confirmPay(${idx})">${actionLabel}</button>`;
    } else {
      statusHTML = `<div class="pay-status pending">Válassz fizetési módot</div>`;
    }

    return `
      <div class="pay-card ${paid?'paid':''}" data-color="${colorIdx}">
        <div class="pay-head">
          <h3><span class="marker"></span>${idx+1}. Számla</h3>
          <div class="pay-amount">${fmtFt(grandTotal)}</div>
        </div>
        <div class="pay-items-summary">${itemsHTML}</div>
        ${tipSelectorHTML}
        ${breakdownHTML}
        <div class="pm-grid">${methodsHTML}</div>
        ${statusHTML}
      </div>
    `;
  }).join('');

  return `
    <div class="screen">
      <a class="back-link" onclick="goTo('split')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Számla szétosztás
      </a>
      <div class="screen-head">
        <h1>${groupLabel(tid)} — <em>fizetés</em></h1>
        <p>Minden számla saját fizetési móddal zárható. Kártya, készpénz vagy QR-kód a vendég telefonján.</p>
      </div>
      <div class="pay-list">${cards}</div>
    </div>
  `;
}

function selectPayMethod(idx, methodId) {
  state.paySelection[idx] = methodId;
  render();
}

function selectTip(idx, pct) {
  if (state.billsPaid[idx]) return; // zárolt
  // Ha újra rákattint ugyanarra (és nem 0%), kapcsolja ki
  const cur = state.payTips[idx] || 0;
  state.payTips[idx] = (cur === pct && pct !== 0) ? 0 : pct;
  render();
}

function confirmPay(idx) {
  const methodId = state.paySelection[idx];
  if (!methodId) return;
  const method = PAYMENT_METHODS.find(p => p.id === methodId);
  const amount = billGrandTotal(idx);  // borravalóval együtt

  if (methodId === 'qr') {
    // Open QR modal
    state.modal = {
      type: 'qr',
      billIdx: idx,
      amount,
      ref: genRef(idx),
    };
    render();
  } else {
    // Direct confirm
    finalizePayment(idx, method.label, methodId);
  }
}

function finalizePayment(idx, methodLabel, methodId) {
  const subtotal = billTotal(state.bills[idx]);
  const tipPct = billTipPercent(idx);
  const tipAmt = billTipAmount(idx);
  const amount = subtotal + tipAmt;
  state.billsPaid[idx] = {
    method: methodLabel,
    methodId,
    amount,         // teljes fizetett összeg (borravalóval)
    subtotal,
    tipPct,
    tipAmt,
    time: nowTime(),
    ref: genRef(idx),
  };
  // Build receipt data
  buildReceiptData(idx);
  const tipPart = tipPct > 0 ? ` (+${tipPct}% borravaló)` : '';
  toast(`${idx+1}. számla fizetve — ${methodLabel}${tipPart}`, { type:'success' });
  state.modal = null;
  render();
}

function buildReceiptData(idx) {
  const tid = state.currentTableId;
  const t = state.tables[tid];
  const uids = state.bills[idx];

  // Kategóriánként csoportosítva
  const grouped = groupUidsByCategory(uids);

  const subtotal = grouped.reduce((s, g) => s + g.catSubtotal, 0);
  const tipPct = billTipPercent(idx);
  const tipAmt = billTipAmount(idx);
  const grandTotal = subtotal + tipAmt;
  // ÁFA-számítás csak a részösszegre (a borravaló nem ÁFA-köteles)
  const vat = Math.round(subtotal * 0.27 / 1.27); // 27% VAT included
  const net = subtotal - vat;

  const paid = state.billsPaid[idx];

  state.receiptsByBill[idx] = {
    tableId: tid,
    billIdx: idx,
    grouped,       // [{cat, items, catSubtotal}]
    subtotal,
    tipPct,
    tipAmt,
    grandTotal,
    vat,
    net,
    method: paid.method,
    methodId: paid.methodId,
    time: paid.time,
    date: new Date().toLocaleDateString('hu-HU'),
    ref: paid.ref,
    guests: t.guests,
  };
}

function openReceipt(idx) {
  state.modal = { type: 'receipt', billIdx: idx };
  render();
}

function renderModal() {
  // Cart sheet has priority when open
  if (state.cartSheetOpen && state.screen === 'order' && !state.modal) {
    renderCartSheetIfNeeded();
    return;
  }

  const root = $('#modal-root');
  const m = state.modal;
  if (!m) { root.innerHTML = ''; return; }

  if (m.type === 'welcome') {
    root.innerHTML = renderWelcomeModal();
    return;
  }
  if (m.type === 'qr') {
    root.innerHTML = renderQRModal(m);
    // Generate the QR
    setTimeout(() => generateQR(m), 30);
    return;
  }
  if (m.type === 'receipt') {
    root.innerHTML = renderReceiptModal(m);
    return;
  }
  if (m.type === 'reset-confirm') {
    root.innerHTML = renderResetConfirm();
    return;
  }
  if (m.type === 'unmerge-confirm') {
    root.innerHTML = renderUnmergeConfirm();
    return;
  }
}

function generateQR(m) {
  const target = document.getElementById('qrcode-target');
  if (!target) return;
  target.innerHTML = '';

  // MNB QVIK HCT (Hungarian Credit Transfer) szabványos QR-kód
  // 17 mező LF (\n) elválasztással, a sorrend rögzített
  // Forrás: MNB QR-kód útmutató (qr-kod-utmutato-20190712-en.pdf)
  const ref = m.ref;
  const tid = state.currentTableId;
  const billNo = m.billIdx + 1;

  // Az étterem adatai (demó értékek)
  const RESTAURANT = {
    name: 'SplitEasy Demo Restaurant',
    iban: 'HU42117730161111101800000000',  // demó IBAN — valós telepítésnél az étteremé
    bic:  'OTPVHUHB',
  };

  // Esedékesség: aznapra
  const due = new Date();
  const yyyy = due.getFullYear();
  const mm = String(due.getMonth() + 1).padStart(2, '0');
  const dd = String(due.getDate()).padStart(2, '0');
  const dueDate = `${yyyy}${mm}${dd}`;  // YYYYMMDD

  // QVIK HCT mezők (17 db):
  // 1: ID code (HCT = credit transfer order)
  // 2: Version (001)
  // 3: Character set (1 = UTF-8)
  // 4: BIC of beneficiary
  // 5: Beneficiary name
  // 6: Beneficiary IBAN
  // 7: Amount (HUF + összeg, pl. HUF14250)
  // 8: Due date (YYYYMMDD)
  // 9: Payment situation identifier (üres = általános vásárlás)
  // 10: Remittance info (közlemény, max 70 char)
  // 11: Shop ID
  // 12: Merchant device ID
  // 13: Receipt ID
  // 14: Customer ID (üres)
  // 15: Payee internal transaction ID
  // 16: Loyalty ID (üres)
  // 17: NAV verification code (üres)

  const remittance = `${tid}. asztal / ${billNo}. szamla / ${ref}`.substring(0, 70);
  const fields = [
    'HCT',                                  // 1
    '001',                                  // 2
    '1',                                    // 3 UTF-8
    RESTAURANT.bic,                         // 4
    RESTAURANT.name,                        // 5
    RESTAURANT.iban,                        // 6
    `HUF${m.amount}`,                       // 7
    dueDate,                                // 8
    '',                                     // 9
    remittance,                             // 10
    'SPLITEASY-DEMO',                       // 11 Shop ID
    `T${tid}-POS`,                          // 12 Merchant device ID
    ref,                                    // 13 Receipt ID
    '',                                     // 14
    `SE-${ref}`,                            // 15
    '',                                     // 16
    ''                                      // 17
  ];

  // Mezők LF-fel elválasztva, az utolsó után is LF
  const payload = fields.join('\n') + '\n';

  try {
    new QRCode(target, {
      text: payload,
      width: 220,
      height: 220,
      colorDark: '#0F172A',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M,
    });
  } catch (err) {
    console.error('QR error:', err);
    target.innerHTML = '<div style="padding:40px;color:#999;">QR betöltése sikertelen</div>';
  }
}

async function downloadReceiptPDF(billIdx) {
  const receipt = document.getElementById('receipt-content');
  if (!receipt) { toast('Hiba: nem található a nyugta', { type:'error' }); return; }
  const r = state.receiptsByBill[billIdx];
  if (!r) { toast('Hiba: hiányzó nyugta adat', { type:'error' }); return; }

  toast('PDF generálása…', { duration: 1500 });

  try {
    // Use html2canvas to capture the receipt with Hungarian chars intact
    const canvas = await html2canvas(receipt, {
      backgroundColor: '#ffffff',
      scale: 2,
      logging: false,
      useCORS: true,
    });

    const imgData = canvas.toDataURL('image/png');

    // Use jsPDF
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4',
    });
    // Width: standard receipt 80mm, center on A4
    const pdfW = 210;
    const pdfH = 297;
    const margin = 15;
    const imgW = pdfW - 2 * margin;
    const aspectRatio = canvas.height / canvas.width;
    const imgH = imgW * aspectRatio;

    if (imgH <= pdfH - 2 * margin) {
      pdf.addImage(imgData, 'PNG', margin, margin, imgW, imgH);
    } else {
      // Scale down to fit
      const fitH = pdfH - 2 * margin;
      const fitW = fitH / aspectRatio;
      pdf.addImage(imgData, 'PNG', (pdfW - fitW) / 2, margin, fitW, fitH);
    }

    const filename = `SplitEasy_nyugta_T${r.tableId}_B${r.billIdx+1}_${r.ref}.pdf`;
    pdf.save(filename);
    toast('Nyugta letöltve ✓', { type:'success' });
  } catch (err) {
    console.error(err);
    toast('PDF letöltés sikertelen — próbáld újra', { type:'error' });
  }
}

/* =====================================================
   CLOSE TABLE
   ===================================================== */
function closeTable() {
  const tid = state.currentTableId;
  const t = state.tables[tid];
  const subtotalAll = tableTotal(tid);
  // Befizetett teljes összeg (borravalókkal együtt) = a billsPaid amount-jainak összege
  const total = state.billsPaid.reduce((s, p) => s + (p ? p.amount : 0), 0);
  const tipTotal = state.billsPaid.reduce((s, p) => s + (p && p.tipAmt ? p.tipAmt : 0), 0);
  const openedAt = t.openedAt || Date.now();
  // Csoport-tagok (master + slave-ek), mielőtt feloldjuk
  const groupMembers = isMaster(tid) ? t.mergedWith.slice() : [tid];
  const labelAtClose = groupLabel(tid);

  // Build summary BEFORE freeing the table (otherwise tableTotal returns 0)
  const summary = {
    tableId: tid,
    tableLabel: labelAtClose,
    groupMembers,
    guests: t.guests,
    bills: state.bills.length,
    subtotal: subtotalAll,
    tipTotal,
    total,
    openedAt,
    paidAt: Date.now(),
    receipts: state.receiptsByBill.slice(),
    entries: state.billsPaid.map((p, i) => ({
      billIdx: i,
      method: p.method,
      methodId: p.methodId,
      amount: p.amount,
      tipAmt: p.tipAmt || 0,
      tipPct: p.tipPct || 0,
      time: p.time,
      ref: p.ref,
      units: state.bills[i].length,
    })),
  };
  state.closedSummary = summary;

  // Free up the table AND all group members
  for (const id of groupMembers) {
    state.tables[id] = {
      status: 'free', guests: 0, orderUnits: [], openedAt: null,
      mergedInto: null, mergedWith: null,
    };
  }
  state.bills = [];
  state.billsPaid = [];
  state.paySelection = {};
  state.payTips = {};

  goTo('closed');
}

/* =====================================================
   SCREEN: CLOSED
   ===================================================== */
function renderClosed() {
  const s = state.closedSummary;
  if (!s) return renderTables();

  const openedMins = Math.max(1, Math.floor((s.paidAt - s.openedAt) / 60000));
  const methods = [...new Set(s.entries.map(e => e.method))];

  const colorMap = {
    0: 'var(--teal-500)', 1: 'var(--plum-500)',
    2: 'var(--amber-500)', 3: 'var(--rose-500)',
  };

  const logRows = s.entries.map(e => `
    <div class="log-row">
      <span class="time">${e.time}</span>
      <span class="desc">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorMap[e.billIdx%4]};margin-right:6px;vertical-align:middle;"></span>
        ${e.billIdx+1}. Számla<small>${e.method} · ${e.units} tétel${e.tipAmt > 0 ? ` · 💚 borravaló ${e.tipPct}% (${fmtFt(e.tipAmt)})` : ''} · ref: ${e.ref}</small>
      </span>
      <span class="amt">${fmtFt(e.amount)}</span>
    </div>
  `).join('');

  const receiptBtns = s.entries.map((e, i) => `
    <button class="show-receipt-btn" onclick="reopenClosedReceipt(${i})">
      📄 ${i+1}. nyugta megtekintése
    </button>
  `).join('');

  return `
    <div class="screen">
      <div class="success-hero">
        <div class="success-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1>${s.tableLabel || (s.tableId + '. asztal')} — <em>lezárva</em></h1>
        <p>${(s.groupMembers && s.groupMembers.length > 1)
          ? `🔗 Összevont csoport feloldva — mind a ${s.groupMembers.length} asztal újra szabad.`
          : 'Az asztal automatikusan „Szabad"-ra váltott. Új vendéget máris fogadhatsz.'}</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="val">${fmtFt(s.total)}</div><div class="lbl">Befizetett</div></div>
        <div class="stat-card"><div class="val">${fmtFt(s.tipTotal || 0)}</div><div class="lbl">Borravaló</div></div>
        <div class="stat-card"><div class="val">${s.bills} db</div><div class="lbl">Számla</div></div>
        <div class="stat-card"><div class="val">${openedMins} p</div><div class="lbl">Asztal-idő</div></div>
      </div>

      <div class="log-card">
        <h3>Tranzakciós napló</h3>
        ${logRows}
      </div>

      <div class="log-card">
        <h3>Nyugták újranyitása</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">${receiptBtns}</div>
      </div>
    </div>
  `;
}

function reopenClosedReceipt(idx) {
  // Use the receipts data captured at close time, no state mutation
  state.receiptsByBill = state.closedSummary.receipts.slice();
  state.currentTableId = state.closedSummary.tableId;
  state.modal = { type: 'receipt', billIdx: idx, fromClosed: true };
  render();
}

/* =====================================================
   BOTTOM BAR (context-aware)
   ===================================================== */
function renderBottomBar(bar) {
  // Show / hide + content based on screen
  if (state.screen === 'tables' || state.screen === 'closed') {
    if (state.screen === 'closed') {
      bar.classList.remove('hidden');
      bar.innerHTML = `
        <div class="bottom-info">Készen állsz új vendég fogadására</div>
        <button class="btn btn-primary" onclick="goTo('tables')">Asztalokhoz →</button>
      `;
    } else if (state.mergeMode) {
      // Merge mode action bar
      const n = state.mergeSelected.size;
      const sortedIds = Array.from(state.mergeSelected).sort((a, b) => a - b);
      const label = sortedIds.join('–');
      bar.classList.remove('hidden');
      bar.innerHTML = `
        <div class="bottom-info">
          ${n === 0 ? 'Válassz legalább 2 szabad asztalt' :
            n === 1 ? '<strong>1 asztal</strong> · legalább még 1 kell' :
            `<strong>${n} asztal</strong> · ${label}`}
        </div>
        <button class="btn btn-primary" ${n<2?'disabled':''} onclick="confirmMerge()">
          Összevon ✓
        </button>
      `;
    } else {
      bar.classList.add('hidden');
      bar.innerHTML = '';
    }
    return;
  }

  if (state.screen === 'order') {
    const cnt = orderCartCount();
    const tot = orderCartTotal();
    bar.classList.remove('hidden');
    bar.innerHTML = `
      <div class="bottom-info">
        <span class="lbl">Kosár</span><br>
        <strong>${cnt} tétel</strong> · <span class="price">${fmtFt(tot)}</span>
      </div>
      <button class="btn btn-primary" ${cnt===0?'disabled':''} onclick="saveOrder()">
        Rendelés →
      </button>
    `;
    return;
  }

  if (state.screen === 'split') {
    const tid = state.currentTableId;
    const t = state.tables[tid];
    const assignedSet = new Set();
    state.bills.forEach(b => b.forEach(uid => assignedSet.add(uid)));
    const unassignedCount = t.orderUnits.length - assignedSet.size;
    const canProceed = unassignedCount === 0 && state.bills.every(b => b.length > 0);

    bar.classList.remove('hidden');
    bar.innerHTML = `
      <div class="bottom-info">
        ${canProceed
          ? `✅ <strong>${state.bills.length} számla</strong> kész`
          : `<strong>${unassignedCount}</strong> tétel szétosztatlan${state.bills.some(b=>b.length===0)?' · üres számla':''}`}
      </div>
      <button class="btn btn-primary" ${canProceed?'':'disabled'} onclick="goTo('payment')">
        Fizetéshez →
      </button>
    `;
    return;
  }

  if (state.screen === 'payment') {
    const totalBills = state.bills.length;
    const paidCount = state.billsPaid.filter(p => p).length;
    const allPaid = totalBills > 0 && paidCount === totalBills;
    const paidSum = state.billsPaid.reduce((s, p) => s + (p ? p.amount : 0), 0);

    bar.classList.remove('hidden');
    bar.innerHTML = `
      <div class="bottom-info">
        ${allPaid
          ? `✅ Minden számla fizetve — <strong>${fmtFt(paidSum)}</strong>`
          : `<strong>${paidCount}/${totalBills}</strong> számla fizetve`}
      </div>
      <button class="btn btn-primary" ${allPaid?'':'disabled'} onclick="closeTable()">
        Asztal lezárása ✓
      </button>
    `;
    return;
  }
}

/* =====================================================
   ORDER CART SHEET (popup with full list)
   ===================================================== */
function renderCartSheetIfNeeded() {
  if (state.screen !== 'order' || !state.cartSheetOpen || state.orderCart.length === 0) return;

  const root = $('#modal-root');
  const rowsHTML = state.orderCart.map(r => {
    const m = menuOf(r.menuId);
    return `
      <div class="cart-row">
        <div class="em">${m.emoji}</div>
        <div class="nm">${m.name}<span class="pr">${fmtFt(m.price)}</span></div>
        <div class="qty-stepper">
          <button class="qty-stepper-btn" onclick="changeCartQty('${m.id}', -1)">−</button>
          <span class="qty-val">${r.qty}</span>
          <button class="qty-stepper-btn" onclick="changeCartQty('${m.id}', 1)">+</button>
        </div>
        <span class="subtotal">${fmtFt(m.price * r.qty)}</span>
      </div>
    `;
  }).join('');

  root.innerHTML = `
    <div class="cart-sheet-overlay" onclick="closeCartSheet()"></div>
    <div class="cart-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3>Kosár · ${orderCartCount()} tétel</h3>
        <button class="sheet-close" onclick="closeCartSheet()" aria-label="Bezárás">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="sheet-list">${rowsHTML}</div>
      <div class="sheet-total">
        <span class="lbl">Végösszeg</span>
        <span class="val">${fmtFt(orderCartTotal())}</span>
      </div>
    </div>
  `;
}
function closeCartSheet() {
  state.cartSheetOpen = false;
  render();
}

/* =====================================================
   RESET
   ===================================================== */
function askReset() {
  state.modal = { type: 'reset-confirm' };
  render();
}

function renderResetConfirm() {
  return `
    <div class="modal-overlay" onclick="cancelResetConfirm(event)">
      <div class="modal" style="max-width:380px;" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h2>Újraindítás?</h2>
          <button class="modal-close" onclick="cancelResetConfirm()" aria-label="Bezárás">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p>Az összes asztal, rendelés és nyugta visszaáll a demó kiindulási állapotába.</p>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="cancelResetConfirm()">Mégse</button>
          <button class="btn btn-primary" onclick="doReset()">Igen, újraindítom</button>
        </div>
      </div>
    </div>
  `;
}
function cancelResetConfirm(e) {
  if (e && e.target !== e.currentTarget && !e.target.closest('.modal-close')) return;
  state.modal = null;
  render();
}
function doReset() {
  state = createInitialState();
  state.modal = null;
  render();
  toast('Demó visszaállítva ✓', { type:'success' });
}

/* =====================================================
   GLOBAL EVENT BINDINGS
   ===================================================== */
$('#resetBtn').addEventListener('click', askReset);
$('#brandLogo').addEventListener('click', () => goTo('tables'));

/* =====================================================
   INIT
   ===================================================== */
function init() {
  if (!welcomeShown) state.modal = { type: 'welcome' };
  render();
}
init();
</script>
